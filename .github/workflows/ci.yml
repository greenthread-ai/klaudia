name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      # Pure Go: the build must stay CGO_ENABLED=0-clean (no cgo, no system libs).
      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      # Code nothing calls, tests included. vet does not look for it, and
      # eight such functions had accumulated before this step existed.
      # Functions only tests reach are not flagged: some are deliberate seams.
      - name: Dead code
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test ./...)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Test
        run: go test ./internal/... -count=1

      # The real binary in a pty against a scripted mock provider on
      # 127.0.0.1: no API key, no network. Skipped by the step above, which
      # leaves KLAUDIA_E2E unset. See internal/tui/e2e/doc.go.
      - name: TUI end-to-end
        run: KLAUDIA_E2E=1 go test ./internal/tui/e2e/... -count=1 -v
