name: Release

on:
  # Cut a release: pick the bump, CI does the rest.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [minor, patch, major]
        default: minor
      dry_run:
        description: 'Rehearse only: build nothing public, push nothing'
        type: boolean
        default: false
  # A tag cut by hand (scripts/release.sh --no-push, then git push) still
  # publishes. Tags pushed by this workflow do NOT arrive here — see below.
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: the build reads the
          # commit out of VCS metadata for `klaudia --version`, and both
          # GoReleaser and scripts/release.sh need the preceding tags.
          fetch-depth: 0
          # persist-credentials is left at its default true: scripts/release.sh
          # pushes the changelog commit and tag with it. checkout v6 moved
          # those credentials out of .git/config into a file under
          # $RUNNER_TEMP; git push still picks them up, and the runner-version
          # caveat on that change applies to Docker container actions, which
          # this workflow does not use. Setting persist-credentials: false
          # here would break the dispatch path, not harden it.

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      # ci.yml triggers on `branches: [main]`, which neither a tag push nor a
      # dispatch matches — without this a release would be the one build
      # nothing gates. Runs before the tag is cut, so a failure leaves no tag.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/... -count=1

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Stamps the changelog, commits, tags and pushes. The publish step below
      # runs in this same job on purpose: a tag pushed with GITHUB_TOKEN does
      # not start a new workflow run (GitHub suppresses it to prevent
      # recursion), so a separate tag-triggered publish job would never fire
      # and the failure would be silent — tag present, release missing.
      - name: Cut the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          scripts/release.sh '${{ inputs.bump }}' \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish
        if: '!inputs.dry_run'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Proves the matrix still builds and the archives are well-formed
      # without creating a tag or a release.
      - name: Rehearse (dry run only)
        if: inputs.dry_run
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
