<svg xmlns="http://www.w3.org/2000/svg" width="755" height="544" viewBox="0 0 755 544" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15">
<rect width="100%" height="100%" rx="10" fill="#121212"/>
<text x="22" y="37" textLength="360.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#91c7d9" font-weight="700">✦ Klaudia</tspan><tspan fill="#cccccc" opacity="0.62"> your overqualified rubber duck</tspan></text>
<text x="22" y="57" textLength="279.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc" opacity="0.62">  model: claude-opus-5</tspan><tspan fill="#cccccc" opacity="0.62">   ⎇ main</tspan></text>
<text x="22" y="77" textLength="621.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#505050" font-style="italic" opacity="0.62">  Enter sends · / commands · @ files · Esc stops · Ctrl+C twice quits</tspan></text>
<text x="22" y="117" textLength="63.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#af875f" font-weight="700">› /help</tspan></text>
<text x="22" y="137" textLength="585.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">Commands — /help &lt;command&gt; for one in full; type / to search them</tspan></text>
<text x="22" y="157" textLength="693.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Session  /model /effort /mode /theme /status /stats /config /compact /clear</tspan></text>
<text x="22" y="177" textLength="270.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">           /export /quit /help</tspan></text>
<text x="22" y="197" textLength="513.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Work     /plan /goal /stop /changes /diff /undo /commit</tspan></text>
<text x="22" y="217" textLength="504.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Context  /context /pin /unpin /forget /add-dir /memory</tspan></text>
<text x="22" y="237" textLength="459.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Shell    !&lt;command&gt; /jobs /logs /restart /stopjob</tspan></text>
<text x="22" y="257" textLength="531.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Find     /search /outline /show /errors /last /copy /open</tspan></text>
<text x="22" y="277" textLength="342.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Setup    /mcp /agents /trust /doctor</tspan></text>
<text x="22" y="317" textLength="45.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">Keys:</tspan></text>
<text x="22" y="337" textLength="486.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  /              Type a slash to see matching commands</tspan></text>
<text x="22" y="357" textLength="603.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  @              Pick a file to mention (Tab cycles, Esc dismisses)</tspan></text>
<text x="22" y="377" textLength="288.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Enter          Send the prompt</tspan></text>
<text x="22" y="397" textLength="585.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Option+Return  Newline without sending (or end the line with \)</tspan></text>
<text x="22" y="417" textLength="540.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Tab            Complete a /command or an @&lt;path&gt; reference</tspan></text>
<text x="22" y="437" textLength="711.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  ↑ / ↓          Previous prompts (queued message first), or move in the @ menu</tspan></text>
<text x="22" y="457" textLength="333.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Ctrl+U         Delete before cursor</tspan></text>
<text x="22" y="477" textLength="324.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Ctrl+K         Delete after cursor</tspan></text>
<text x="22" y="497" textLength="639.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Esc            Dismiss the file menu, or interrupt the model mid-turn</tspan></text>
<text x="22" y="517" textLength="603.00" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#cccccc">  Ctrl+C         Interrupt, or clear the line — press twice to quit</tspan></text>
</svg>
